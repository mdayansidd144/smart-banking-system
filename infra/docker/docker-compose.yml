version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: smartbank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartbank
      POSTGRES_USER: smartbank
      POSTGRES_PASSWORD: smartbank123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartbank"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_data: