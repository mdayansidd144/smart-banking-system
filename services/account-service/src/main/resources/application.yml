server:
  port: 8080
spring:
  application:
    name: account-service
  datasource:
    url: jdbc:postgresql://localhost:5432/smartbank
    username: smartbank
    password: smartbank123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  level:
    org.hibernate.SQL: DEBUG