server:
  port: 9000

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        # Identity service — public, no auth needed
        - id: identity-service
          uri: http://localhost:8083
          predicates:
            - Path=/auth/**

        # Account service
        - id: account-service
          uri: http://localhost:8080
          predicates:
            - Path=/api/v1/accounts/**,/api/v1/transfers/**

        # Fraud service
        - id: fraud-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/fraud/**

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.cloud.gateway: INFO