server:
  port: 8082

spring:
  application:
    name: fraud-service

  datasource:
    url: jdbc:postgresql://postgres:5432/smartbank
    username: smartbank
    password: smartbank123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: kafka:9092
    consumer:
      group-id: fraud-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.smartbank.*
        spring.json.use.type.headers: false

langchain4j:
  ollama:
    chat-model:
      base-url: http://host.docker.internal:11434
      model-name: llama3.2:latest
      temperature: 0.2
      timeout: PT180S

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.smartbank.fraud: DEBUG
    com.smartbank.fraud.ai: DEBUG
    dev.langchain4j: INFO
    org.apache.kafka: WARN
    org.springframework.kafka: WARN