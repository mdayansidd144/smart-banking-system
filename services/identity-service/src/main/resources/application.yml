server:
  port: 8083

spring:
  application:
    name: identity-service

  datasource:
    url: jdbc:postgresql://postgres:5432/smartbank
    username: smartbank
    password: smartbank123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # Multipart uploads for avatar images
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

# JWT
jwt:
  secret: SmartBankSuperSecretKeyForJWTTokenSigning2026MustBeAtLeast32BytesLong!
  expiration-ms: 86400000    # 24 hours

# Google OAuth
google:
  client-id: ${GOOGLE_CLIENT_ID:}

# Avatar file storage
storage:
  avatars:
    dir: /app/uploads/avatars

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.smartbank.identity: DEBUG
    org.hibernate.SQL: WARN